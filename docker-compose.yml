version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: image-manager-postgres
    environment:
      POSTGRES_DB: image_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - image-manager-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO对象存储
  minio:
    image: minio/minio:latest
    container_name: image-manager-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - image-manager-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Python后端服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: image-manager-server
    environment:
      DEBUG: "False"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: image_manager
      DB_USER: postgres
      DB_PASSWORD: password
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: "False"
      SECRET_KEY: your-super-secret-jwt-key-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      CORS_ORIGINS: '["http://localhost", "http://localhost:3000"]'
      USE_AI_DESCRIPTION: "False"
      # AI_MODEL_PATH: "/app/models/Janus-Pro-7B"  # Uncomment to use AI description
    volumes:
      - ai_model_data:/app/models  # Volume for AI model data
    ports:
      - "3001:3001"
    networks:
      - image-manager-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: image-manager-client
    ports:
      - "80:80"
    networks:
      - image-manager-network
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  ai_model_data:  # New volume for AI model data
    driver: local

networks:
  image-manager-network:
    driver: bridge